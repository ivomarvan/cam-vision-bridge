[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cam-vision-bridge"
version = "0.1.0"
description = "Bridge a mobile phone camera to Python computer-vision experiments over WebRTC."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "pydantic==2.14.4",  # Protocol v1 message and result models (single contract source).
    "opencv-python-headless==5.1.0.95",  # JPEG decode via cv2.imdecode (headless, no GUI libs).
    "numpy==2.5.5",  # RGB ndarray frames; OpenCV 5.1 expects this major line.
    "aiortc==1.16.0",  # WebRTC peer: DataChannel for JPEG frames (MVP transport).
    "websockets==17.4",  # PeerJS signaling WebSocket client toward the cloud broker.
    "qrcode==8.2",  # Terminal QR for the GitHub Pages pairing URL at PhoneCamera start.
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",  # Unit and integration tests; markers unit / integration / slow.
    "ruff==0.17.6",  # Linter and formatter for the deterministic library gate.
    "mypy==2.4.1",  # Static typing; gate runs mypy src/ --strict.
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
    ".cursor",
    "doc",
    "experiments",
    "web",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "unit: fast, no I/O",
    "integration: requires DB or network",
    "slow: > 5s",
]